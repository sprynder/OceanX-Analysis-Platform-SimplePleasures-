# infra/docker-compose.yml
version: "3.9"

services:
  nginx:
      image: nginx
      ports:
        - "80:80"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - videos:/data/videos:ro
        - rois:/data/rois:ro
      depends_on:
        - backend-go
        - frontend

  backend-go:
    build: ../backend-go
    ports: ["8080:8080"]
    depends_on: [postgres, backend-ml]
    environment:
      - DATABASE_URL=postgres://oceanx:oceanx@postgres:5432/oceanx?sslmode=disable
      - ML_SERVICE_URL=http://backend-ml:8000
    volumes:
      - videos:/data/videos

  postgres:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oceanx
      POSTGRES_USER: oceanx
      POSTGRES_PASSWORD: oceanx
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend-ml:
    build:
      context: ../../
      dockerfile: oceanx-backend/backend-ml/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - videos:/data/videos
      - rois:/data/rois
      # Mount app source so Python changes are picked up without rebuild
      - ../backend-ml/app:/app/app
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GATEWAY_API=http://backend-go:8080
      - ROI_DIR=/data/rois
      - DATA_POC_ROOT=/opt/oceanx-data-poc
      - DATASETS_ROOT=/opt/oceanx-data-poc/data
      - OPENRVDAS_ROOT=/opt/oceanx-data-poc/OpenRVDAS
      - PIPELINE_TOOLS_PATH=/opt/oceanx-data-poc/analysis_tools/pipeline_tools.py
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ../../oceanx-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost
    depends_on:
      - backend-go
    volumes:
      - videos:/data/videos
      - rois:/data/rois
      # Mount src so Next.js dev server hot-reloads on file changes
      - ../../oceanx-frontend/src:/app/src
      - ../../oceanx-frontend/public:/app/public

volumes:
  qdrant_data:
  videos:
  rois:
  pgdata:
