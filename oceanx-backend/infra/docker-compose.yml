# infra/docker-compose.yml
version: "3.9"

services:
  nginx:
      image: nginx
      ports:
        - "80:80"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      depends_on:
        - backend-go

  backend-go:
    build: ../backend-go
    ports: ["8080:8080"]
    depends_on: [postgres, backend-ml]
    environment:
      - DATABASE_URL=postgres://oceanx:oceanx@postgres:5432/oceanx?sslmode=disable
      - ML_SERVICE_URL=http://backend-ml:8000
    volumes:
      - videos:/data/videos

  postgres:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oceanx
      POSTGRES_USER: oceanx
      POSTGRES_PASSWORD: oceanx
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend-ml:
    build:
      context: ../backend-ml
    ports:
      - "8000:8000"
    volumes:
      - videos:/data/videos
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GATEWAY_API=http://backend-go:8080

volumes:
  qdrant_data:
  videos:
  pgdata:
