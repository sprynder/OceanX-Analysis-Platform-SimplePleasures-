# infra/docker-compose.yml
version: "3.9"

services:
  nginx:
      image: nginx
      ports:
        - "80:80"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - videos:/data/videos:ro
        - rois:/data/rois:ro
      depends_on:
        - backend-go
        - frontend

  backend-go:
    build: ../backend-go
    ports: ["8080:8080"]
    depends_on: [postgres, backend-ml]
    environment:
      - DATABASE_URL=postgres://oceanx:oceanx@postgres:5432/oceanx?sslmode=disable
      - ML_SERVICE_URL=http://backend-ml:8000
      - RVDAS_INGEST_DIR=/data/rvdas
    volumes:
      - videos:/data/videos
      - rvdas_ingestion:/data/rvdas

  postgres:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oceanx
      POSTGRES_USER: oceanx
      POSTGRES_PASSWORD: oceanx
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend-ml:
    build:
      context: ../backend-ml
    ports:
      - "8000:8000"
    volumes:
      - videos:/data/videos
      - rois:/data/rois
      - model_cache:/root/.cache
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GATEWAY_API=http://backend-go:8080
      - ROI_DIR=/data/rois
      - TORCH_HOME=/root/.cache/torch
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/transformers
      - TIMM_CACHE_DIR=/root/.cache/timm

  celery-worker:
    build:
      context: ../backend-ml
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GATEWAY_API=http://backend-go:8080
      - ROI_DIR=/data/rois
      - GO_API_URL=http://backend-go:8080
      - TORCH_HOME=/root/.cache/torch
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/transformers
      - TIMM_CACHE_DIR=/root/.cache/timm
    volumes:
      - videos:/data/videos
      - rois:/data/rois
      - model_cache:/root/.cache
    depends_on:
      - redis
      - backend-ml
      - qdrant
    restart: unless-stopped

  frontend:
    build: ../../oceanx-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost
    depends_on:
      - backend-go
    volumes:
      - videos:/data/videos
      - rois:/data/rois

volumes:
  qdrant_data:
  redis_data:
  videos:
  rois:
  rvdas_ingestion:
  model_cache:
  pgdata:
