# infra/docker-compose.yml
version: "3.9"

services:
  nginx:
      image: nginx
      ports:
        - "80:80"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - videos:/data/videos:ro
        - rois:/data/rois:ro
      depends_on:
        - backend-go
        - frontend

  postgres:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oceanx
      POSTGRES_USER: oceanx
      POSTGRES_PASSWORD: oceanx
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
  backend-go:
    build: ../backend-go
    ports: ["8080:8080"]
    depends_on: [postgres, backend-ml]
    environment:
      - DATABASE_URL=postgres://oceanx:oceanx@postgres:5432/oceanx?sslmode=disable
      - ML_SERVICE_URL=http://backend-ml:8000
    volumes:
      - videos:/data/videos
  spark-master:
    build:
      context: ./spark
    image: oceanx-spark:4.1.1-py311-java17
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - PYSPARK_PYTHON=/opt/conda/bin/python
      - PYSPARK_DRIVER_PYTHON=/opt/conda/bin/python
    ports:
      - '8082:8080' # Master Web UI
      - '7077:7077' # Master Port
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./spark-data:/opt/spark-data
    networks:
      - spark-net

  spark-worker:
    image: oceanx-spark:4.1.1-py311-java17
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_WEBUI_PORT=8081
      - PYSPARK_PYTHON=/opt/conda/bin/python
      - PYSPARK_DRIVER_PYTHON=/opt/conda/bin/python
    expose:
      - '8081'
    depends_on:
      - spark-master
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./spark-data:/opt/spark-data
    networks:
      - spark-net

  backend-ml:
    build:
      context: ../backend-ml
    ports:
      - "8000:8000"
    volumes:
      - videos:/data/videos
      - rois:/data/rois
      - model_cache:/root/.cache
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GATEWAY_API=http://backend-go:8080
      - ROI_DIR=/data/rois
      - KMEANS_USE_SPARK=true
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_APP_NAME=oceanx-clustering-kmeans
      - SPARK_DRIVER_HOST=backend-ml
      - SPARK_DRIVER_BIND_ADDRESS=0.0.0.0
      - PYSPARK_PYTHON=/opt/conda/bin/python
      - PYSPARK_DRIVER_PYTHON=python3
      - TORCH_HOME=/root/.cache/torch
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/transformers
      - TIMM_CACHE_DIR=/root/.cache/timm
    networks:
      - default
      - spark-net

  celery-worker:
    build:
      context: ../backend-ml
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GATEWAY_API=http://backend-go:8080
      - ROI_DIR=/data/rois
      - GO_API_URL=http://backend-go:8080
      - KMEANS_USE_SPARK=true
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_APP_NAME=oceanx-clustering-kmeans
      - SPARK_DRIVER_HOST=celery-worker
      - SPARK_DRIVER_BIND_ADDRESS=0.0.0.0
      - PYSPARK_PYTHON=/opt/conda/bin/python
      - PYSPARK_DRIVER_PYTHON=python3
      - TORCH_HOME=/root/.cache/torch
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/transformers
      - TIMM_CACHE_DIR=/root/.cache/timm
    volumes:
      - videos:/data/videos
      - rois:/data/rois
      - model_cache:/root/.cache
    depends_on:
      - redis
      - backend-ml
      - qdrant
    restart: unless-stopped
    networks:
      - default
      - spark-net

  frontend:
    build: ../../oceanx-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost
    depends_on:
      - backend-go
    volumes:
      - videos:/data/videos
      - rois:/data/rois

volumes:
  qdrant_data:
  redis_data:
  videos:
  rois:
  model_cache:
  pgdata:

networks:
  spark-net:
    external: true
    name: spark-net
